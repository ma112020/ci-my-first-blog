version: 2.1
orbs:
  python: circleci/python@0.2.1
jobs:
  build-and-test:
    executor: python/default
    steps:
     - checkout
     - python/load-cache
     - python/install-deps
     - python/save-cache

# CORREÇÃO NECESSÁRIA: Garante que o script manage.py possa ser executado
     - run:
        command: "chmod +x manage.py"
        name: "Permissão de execução do ficheiro manage.py"
     - run:
        command: ./manage.py test
        name: Test
workflows:
 main:
  jobs:
   - build-and-test